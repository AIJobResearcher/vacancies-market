name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start containers
        run: |
          make build
          make up

      - name: Wait for services to be ready
        run: |
          docker-compose exec -T postgres pg_isready -U vacancies_user
          docker-compose exec -T redis redis-cli ping
          docker-compose exec -T rabbitmq rabbitmq-diagnostics ping

      - name: Prepare test database
        run: make db-test-prepare

      - name: Run all tests and static analysis
        run: make test

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit.xml

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Upload integration coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration/

      - name: Stop containers
        if: always()
        run: make down